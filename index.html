:root{
  --bg:#FFF6E5; --ink:#33303E; --pink:#FF6B9D; --yellow:#FFC53C;
  --mint:#3ED6C0; --blue:#5B8DFF; --red:#FF5A5A; --white:#FFF;
  --purple:#8A6FD1;
  --shadow:0 4px 0 #33303E; --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  display:flex;justify-content:center;line-height:1.55;overflow-x:hidden;
  background-image:radial-gradient(#FFE3B0 8%,transparent 9%);background-size:26px 26px;}
#app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 14px calc(26px + env(safe-area-inset-bottom));position:relative;margin-inline:auto}
/* #app は body(flex)の子として高さが viewport に固定される。既定の flex-shrink:1 のままだと
   中身が縦に入り切らない時にカードが潰れて次の見出しと重なる(PCで顕著)。縮ませない=重なり防止。 */
#app>*{flex:0 0 auto;min-width:0}
/* 広い画面: 480pxの列を中央に置いたまま、余白だらけに見えないよう軽い枠で“紙面”にする */
@media (min-width:900px){
  body{background-attachment:fixed}
  #app{max-width:520px;box-shadow:0 0 0 3px var(--ink),0 10px 30px rgba(51,48,62,.18);background:rgba(255,255,255,.55);border-radius:0}
}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle}

@keyframes bin{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.bin{animation:bin .18s ease-out}
@media (prefers-reduced-motion:reduce){.bin{animation:none!important}}
.small-btn{background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:2px 11px;font-size:12px;font-weight:900;font-family:inherit;box-shadow:var(--shadow);cursor:pointer}
.small-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #33303E}
</style>
</head>

<script>window.__MM_STANDALONE=1;</script>
<div id="app"><div class="mm-splash"><div class="mm-intro-logo">MACHIMON<span>社労士</span></div><div class="mm-sub">よみこみ中…</div></div></div>
<script>
/* 起動ウォッチドッグ(インライン=外部JSが1本でも壊れた「無音の真っ白」に効く最後の砦)。
   boot.js が起動に成功したら __mmBoot を立てる。立たなければキャッシュを捨てて1回だけ自動リロード。 */
window.__mmBoot=false;
window.__pwaPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); window.__pwaPrompt=e; });
window.addEventListener("appinstalled",function(){ window.__pwaPrompt=null; });
(function(){
  var checked=false;
  function heal(){
    if(checked||window.__mmBoot)return;
    checked=true;
    var k="mm-heal-wd";
    try{
      if(sessionStorage.getItem(k)){ show(); return; }
      sessionStorage.setItem(k,"1");
    }catch(e){ show(); return; }
    var jobs=[];
    try{ if(window.caches)jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(x){ return caches.delete(x); })); })); }catch(e){}
    try{ if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(Array.prototype.map.call(rs,function(r){ return r.unregister(); })); })); }catch(e){}
    Promise.all(jobs).catch(function(){}).then(function(){ location.reload(); });
  }
  function show(){
    var a=document.getElementById("app"); if(!a)return;
    a.innerHTML='<div style="margin:auto;text-align:center;padding:24px"><div style="font-size:44px">😵</div>'
      +'<div style="font-weight:900;margin:8px 0">読み込みに失敗しました</div>'
      +'<div style="font-size:13px;color:#6B6578">もう一度お試しください(セーブデータは無事です)</div>'
      +'<button style="margin-top:14px;min-height:48px;padding:0 18px;border:2px solid #33303E;border-radius:12px;background:#FFC53C;font-weight:900" onclick="location.reload()">🔄 再読み込み</button></div>';
  }
  window.addEventListener("load",function(){ setTimeout(heal,2500); });
  setTimeout(function(){ if(!window.__mmBoot)heal(); },6000);
})();
</script>
